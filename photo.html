<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photography Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#000;
    color:#fff;

}

/* NAVBAR */
nav{
    background:#FFD700;
    padding:15px;
    text-align:center;

}

nav a{
    color:#000;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
	transition:0.3s;
}
	
nav a:hover{
text-decoration:underline;
background:#000;
color:#FFD700;
padding:5px 10px;
border-radius:8px;
cursor:pointer;
}

/* TITLE */
h1{
    text-align:center;
    color:#FFD700;
    margin-top:40px;

    animation:slideDown 1s ease;
}

/* SLIDER */
.slider{
    max-width:800px;
    margin:40px auto;
    text-align:center;

    animation:fadeUp 1.2s ease;
}

/* A4 STYLE IMAGE FRAME */
.image-box{
    width:100%;
    height:600px;
    border:3px solid #FFD700;
    border-radius:12px;
    background:#111;

    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    animation:zoomIn 1.2s ease;
}

/* IMAGE */
.image-box img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;

    transition:0.5s ease;
}

/* BUTTONS */
.btn{
    display:inline-block;
    margin:20px 10px;
    padding:10px 22px;
    background:#FFD700;
    color:#000;
    font-weight:bold;
    border:none;
    cursor:pointer;
    border-radius:25px;

    transition:0.3s;
}

/* BUTTON MOVEMENT */
.btn:hover{
    transform:scale(1.1) translateY(-3px);
    box-shadow:0 0 15px #FFD700;
}

/* BACK BUTTON */
.back{
    display:block;
    margin:30px auto;
    width:180px;
    text-align:center;
    padding:12px;
    background:#FFD700;
    color:#000;
    text-decoration:none;
    font-weight:bold;
    border-radius:25px;

    transition:0.3s;
    animation:fadeUp 1.5s ease;
}

.back:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #FFD700;
}

/* FOOTER */
footer{
    text-align:center;
    padding:15px;
    background:#FFD700;
    color:#000;
    font-weight:bold;

    animation:fadeUp 1.8s ease;
}

/* ANIMATIONS */
@keyframes pageFade{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes slideDown{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes zoomIn{
    from{opacity:0; transform:scale(0.95);}
    to{opacity:1; transform:scale(1);}
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
</nav>

<!-- TITLE -->
<h1>Photography Gallery</h1>

<!-- SLIDER -->
<div class="slider">

    <div class="image-box">
        <img id="slideImage" src="13.JPG" alt="Gallery Image">
    </div>

    <button class="btn" onclick="prevImage()">Prev</button>
    <button class="btn" onclick="nextImage()">Next</button>

</div>

<!-- BACK -->
<a href="gallery.html" class="back">Back to Gallery</a>

<!-- SCRIPT -->
<script>

const images = [
"13.jpg",
"11.jpeg",
"14.jpg",
"12.jpg",
"15.jpg",
];

let index = 0;

function showImage(){
    const img = document.getElementById("slideImage");

    // fade effect when switching image
    img.style.opacity = 0;

    setTimeout(() => {
        img.src = images[index];
        img.style.opacity = 1;
    }, 200);
}

function nextImage(){
    index++;
    if(index >= images.length){
        index = 0;
    }
    showImage();
}

function prevImage(){
    index--;
    if(index < 0){
        index = images.length - 1;
    }
    showImage();
}

</script>

<!-- FOOTER -->
<footer>
© 2026 My Artwork Collection | Designed by Althea Nicole Sumang
</footer>

</body>

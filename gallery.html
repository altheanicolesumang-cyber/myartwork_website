<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#000;
    color:#fff;
    animation:pageFade 0.8s ease;
}

/* NAVBAR */
nav{
    background:#FFD700;
    padding:15px;
    text-align:center;
}

nav a{
    color:#000;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
	transition:0.3s;
}
	
nav a:hover{
text-decoration:underline;
background:#000;
color:#FFD700;
padding:5px 10px;
border-radius:8px;
cursor:pointer;
}

/* SECTION */
.gallery-section{
    padding:60px 40px;
    text-align:center;
    animation:fadeUp 1s ease;
}

.gallery-section h1{
    color:#FFD700;
    margin-bottom:40px;
    font-size:38px;
}

/* GRID */
.folder-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
    padding:20px 0;
}

/* CARD */
.folder-card{
    background:#111;
    border:2px solid #FFD700;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    text-decoration:none;
    color:#fff;

    transition:0.3s;
    animation:fadeUp 1.4s ease;
}

.folder-card:hover{
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 0 18px #FFD700;
}

/* IMAGE */
.folder-card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

/* TITLE */
.folder-card h3{
    color:#FFD700;
    padding:15px 10px 20px 10px;
    font-size:18px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:15px;
    background:#FFD700;
    color:#000;
    font-weight:bold;
    animation:fadeUp 1.6s ease;
}

/* ANIMATIONS */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pageFade{
    from{opacity:0;}
    to{opacity:1;}
}

</style>
</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
</nav>

<section class="gallery-section">

<h1>My Art Categories</h1>

<div class="folder-grid">

<a href="photoshop.html" class="folder-card">
<img src="ps.jpg" alt="Photoshop">
<h3>Photoshop</h3>
</a>

<a href="ai.html" class="folder-card">
<img src="ai.jpg" alt="Illustrator">
<h3>Illustrator</h3>
</a>


<a href="editing.html" class="folder-card">
<img src="pr.jpg" alt="Editing">
<h3>Premiere Pro</h3>
</a>
	
<a href="photo.html" class="folder-card">
<img src="ph.jpg" alt="Illustrator">
<h3>Photography</h3>
</a>


<a href="drawing.html" class="folder-card">
<img src="draw.jpg" alt="Drawing">
<h3>Drawing</h3>
</a>

</div>

</section>

<footer>
© 2026 My Artwork Collection | Designed by Althea Sumang
</footer>

</body>
</html>

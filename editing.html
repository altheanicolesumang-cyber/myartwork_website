<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premiere Pro Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#000;
    color:#fff;
}

/* NAVBAR */
nav{
    background:#FFD700;
    padding:15px;
    text-align:center;
}

nav a{
    color:#000;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    background:#000;
    color:#FFD700;
    padding:5px 10px;
    border-radius:8px;
}

/* TITLE */
h1{
    text-align:center;
    color:#FFD700;
    margin-top:40px;
    animation:slideDown 1s ease;
}

/* SLIDER */
.slider{
    max-width:800px;
    margin:40px auto;
    text-align:center;
    animation:fadeUp 1.2s ease;
}

/* VIDEO FRAME (A4 STYLE) */
.video-box{
    width:100%;
    height:600px;
    border:3px solid #FFD700;
    border-radius:12px;
    background:#111;
    overflow:hidden;
    animation:zoomIn 1.2s ease;
}

/* VIDEO */
.video-box iframe{
    width:100%;
    height:100%;
    border:none;
}

/* BUTTONS */
.btn{
    display:inline-block;
    margin:20px 10px;
    padding:10px 22px;
    background:#FFD700;
    color:#000;
    font-weight:bold;
    border:none;
    cursor:pointer;
    border-radius:25px;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.1) translateY(-3px);
    box-shadow:0 0 15px #FFD700;
}

/* BACK BUTTON */
.back{
    display:block;
    margin:30px auto;
    width:180px;
    text-align:center;
    padding:12px;
    background:#FFD700;
    color:#000;
    text-decoration:none;
    font-weight:bold;
    border-radius:25px;
    transition:0.3s;
}

.back:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #FFD700;
}

/* FOOTER */
footer{
    text-align:center;
    padding:15px;
    background:#FFD700;
    color:#000;
    font-weight:bold;
}

/* ANIMATIONS */
@keyframes slideDown{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes zoomIn{
    from{opacity:0; transform:scale(0.95);}
    to{opacity:1; transform:scale(1);}
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
</nav>

<!-- TITLE -->
<h1>Premiere Pro Gallery</h1>

<!-- SLIDER -->
<div class="slider">

    <div class="video-box">
        <iframe id="videoFrame" src="https://www.youtube.com/embed/Cf1jwGJDFdM?si=g9lBnI6bgAacuuTQ" allowfullscreen></iframe>
    </div>

    <button class="btn" onclick="prevVideo()">⬅ Prev</button>
    <button class="btn" onclick="nextVideo()">Next ➡</button>

</div>

<!-- BACK -->
<a href="gallery.html" class="back">Back to Gallery</a>

<!-- SCRIPT -->
<script>

const videos = [
"https://www.youtube.com/embed/Cf1jwGJDFdM?si=g9lBnI6bgAacuuTQ",
"https://www.youtube.com/embed/jCTOqgCkgJM?si=eRlUPq6UJfvEe_LV",
"https://www.youtube.com/embed/38AKCyowPt4?si=wOkcNAyPuNWRy1d3",
];

let index = 0;

function showVideo(){
    const frame = document.getElementById("videoFrame");

    frame.style.opacity = 0;

    setTimeout(() => {
        frame.src = videos[index];
        frame.style.opacity = 1;
    }, 200);
}

function nextVideo(){
    index++;
    if(index >= videos.length){
        index = 0;
    }
    showVideo();
}

function prevVideo(){
    index--;
    if(index < 0){
        index = videos.length - 1;
    }
    showVideo();
}

</script>

<!-- FOOTER -->
<footer>
© 2026 My Artwork Collection | Designed by Althea Nicole Sumang
</footer>

</body>
</html>

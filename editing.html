<style>
body { margin:0; font-family:Arial,sans-serif; background:#000; color:#fff; }
/* NAVBAR */
nav { background:#FFD700; padding:15px; text-align:center; }
nav a { color:#000; text-decoration:none; margin:0 18px; font-weight:bold; }
nav a:hover { text-decoration:underline; }
/* IMAGE GRID */
.gallery-section { padding:40px; text-align:center; }
.gallery-section h1 { color:#FFD700; margin-bottom:40px; font-size:38px; }
.image-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:25px; padding:20px 0; }
.image-card { background:#111; border:2px solid #FFD700; border-radius:12px; overflow:hidden; transition:0.3s; }
.image-card:hover { transform:scale(1.05); box-shadow:0 0 15px #FFD700; }
.image-card img { width:100%; height:200px; object-fit:cover; }
/* BACK BUTTON */
.back-btn {
    display:inline-block;
    margin:20px auto 40px auto;
    padding:10px 20px;
    background:#FFD700;
    color:#000;
    font-weight:bold;
    text-decoration:none;
    border-radius:8px;
    transition:0.3s;
}
.back-btn:hover { background:#e6c200; }
/* FOOTER */
footer { text-align:center; padding:15px; background:#FFD700; color:#000; font-weight:bold; }
</style>
</head>
